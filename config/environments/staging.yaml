environment: staging

urls:
  base: "https://staging.example.com"
  api:  "https://staging.example.com/api"

timeouts:
  action:     15000
  navigation: 45000
  api:        20000

execution:
  workers:        4
  retries:        2
  headless:       true
  maxPages:       50
  maxDepth:       4
  circuitBreaker: 5

screenshots:
  onFailure:  true
  dir:        "results/screenshots"

results:
  dir:        "results"

features:
  llmEnabled: true

llm:
  provider: anthropic
  fallback: [mock]

# db_schema — route→table hints for FlowMapper DB suggestion (EPIC-10).
# Uncomment and extend when you want generated tests to include db: validation steps.
#
# db_schema:
#   /api/users:
#     table: users
#     pk:    id
#   /api/orders:
#     table:  orders
#     pk:     id
#     method: [POST, DELETE]
