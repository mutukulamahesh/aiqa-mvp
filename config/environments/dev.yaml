environment: dev

urls:
  base: "https://www.saucedemo.com"
  api:  "http://localhost:3000/api"

timeouts:
  action:     10000   # ms — per Playwright action (click, fill, assert)
  navigation: 30000   # ms — page.goto / waitForURL
  api:        15000   # ms — HTTP request timeout

execution:
  workers:        1
  retries:        0
  headless:       false
  maxPages:       20
  maxDepth:       3
  circuitBreaker: 5

screenshots:
  onFailure:  true
  dir:        "results/screenshots"

results:
  dir:        "results"

features:
  llmEnabled: true

storage:
  maxHistory:   200   # entries retained in history.json and healer-runs.json
  maxArtifacts: 10    # artifact sets kept when using --retain-runs

# Set true to block all outbound LLM calls — only ollama and mock providers are allowed.
# Useful for air-gapped environments or strict data-sovereignty requirements.
# privacy_mode: true

# LLM provider selection.
# provider: anthropic | openai | nvidia | gemini | ollama | mock
# fallback:  ordered list tried when primary fails (optional)
# model:     override the provider default (optional)
# API keys stay in .env — never commit them here.
llm:
  provider: mock
  fallback: []

# SSRF guard — only these URL prefixes are permitted in api: steps.
# Empty allowlist blocks all outbound API calls.
api:
  allowlist:
    - "http://localhost"                      # local application API
    - "https://jsonplaceholder.typicode.com"  # public test API used in smoke tests
  denylist: []

# Jira integration — API token stays in .env as JIRA_API_TOKEN (never commit it here).
# Uncomment and fill in when connecting to a real Jira project.
#
jira:
  baseUrl:                "https://aiqajira.atlassian.net"
  projectKey:             "SCRUM"
  email:                  "mmk.mutu@gmail.com"
  createDefectsOnFailure: false   # set true to auto-create bugs when using run-all
  xraySyncEnabled:        false   # set true + testPlanKey to push results to Xray
  # testPlanKey:          "AIQA-1"

# RAG Knowledge Layer — set enabled: true and run `aiqa knowledge ingest` to activate.
knowledge:
  enabled: false
  indexPath: ".aiqa/knowledge"
  topK: 5
  chunker: naive
  connectors:
    - type: jira
      projectKey: SCRUM

# db_schema — route→table hints for FlowMapper DB suggestion.
# Uncomment and extend when you want generated tests to include db: validation steps.
# method: which HTTP verbs on this route write to the table (default: all mutating verbs).
#
# db_schema:
#   /api/users:
#     table: users
#     pk:    id
#   /api/orders:
#     table:  orders
#     pk:     id
#     method: [POST, DELETE]

# llm_targets — named LLM targets for llm_eval / llm_consistency steps.
# test YAML references "target: local" instead of hardcoding provider/model.
# llm_targets:
#   local:    { provider: ollama, model: llama3.2 }
#   fast:     { provider: anthropic, model: claude-haiku-4-5-20251001 }
#   powerful: { provider: anthropic, model: claude-sonnet-4-6 }
