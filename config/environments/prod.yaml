environment: prod

urls:
  base: "https://example.com"
  api:  "https://example.com/api"

timeouts:
  action:     20000
  navigation: 60000
  api:        25000

execution:
  workers:        4
  retries:        2
  headless:       true
  maxPages:       100
  maxDepth:       5
  circuitBreaker: 5

screenshots:
  onFailure:  true
  dir:        "results/screenshots"

results:
  dir:        "results"

features:
  llmEnabled: true

storage:
  maxHistory:   200
  maxArtifacts: 10

llm:
  provider: anthropic
  fallback: [mock]

# db_schema — route→table hints for FlowMapper DB suggestion (EPIC-10).
# Uncomment and extend when you want generated tests to include db: validation steps.
#
# db_schema:
#   /api/users:
#     table: users
#     pk:    id
#   /api/orders:
#     table:  orders
#     pk:     id
#     method: [POST, DELETE]
