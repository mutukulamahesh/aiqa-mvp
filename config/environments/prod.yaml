environment: prod

urls:
  base: "https://example.com"
  api:  "https://example.com/api"

timeouts:
  action:     20000
  navigation: 60000
  api:        25000

execution:
  workers:        4
  retries:        2
  headless:       true
  maxPages:       100
  maxDepth:       5
  circuitBreaker: 5

screenshots:
  onFailure:  true
  dir:        "results/screenshots"

results:
  dir:        "results"

features:
  llmEnabled: true

# SSRF guard — only these URL prefixes are permitted in api: steps.
# Empty allowlist blocks all outbound API calls.
api:
  allowlist:
    - "https://example.com"                   # production application API base
  denylist:
    - "http://169.254.169.254"                # block AWS/GCP instance metadata
    - "http://metadata.google.internal"       # block GCP metadata endpoint

storage:
  maxHistory:   200
  maxArtifacts: 10

llm:
  provider: anthropic
  fallback: [mock]

# Jira integration — API token stays in .env as JIRA_API_TOKEN (never commit it here).
jira:
  baseUrl:                "https://aiqajira.atlassian.net"
  projectKey:             "SCRUM"
  email:                  "mmk.mutu@gmail.com"
  createDefectsOnFailure: true    # auto-create bugs on failures
  xraySyncEnabled:        false

# RAG Knowledge Layer
knowledge:
  enabled: false
  indexPath: ".aiqa/knowledge"
  topK: 5
  chunker: naive
  connectors:
    - type: jira
      projectKey: SCRUM

# db_schema — route→table hints for FlowMapper DB suggestion.
# Uncomment and extend when you want generated tests to include db: validation steps.
#
# db_schema:
#   /api/users:
#     table: users
#     pk:    id
#   /api/orders:
#     table:  orders
#     pk:     id
#     method: [POST, DELETE]
