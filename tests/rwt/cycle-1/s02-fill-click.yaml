test:
  name: "RWT-S02: fill, click, assert post-login state"
  tags: [rwt, smoke, interaction]
  steps:
    - navigate: "https://www.saucedemo.com"
    - fill:
        target: "#user-name"
        value:  "standard_user"
    - fill:
        target: "#password"
        value:  "secret_sauce"
    - click: "#login-button"
    - assert:
        url: "/inventory"
    - assert:
        visible: ".inventory_list"
