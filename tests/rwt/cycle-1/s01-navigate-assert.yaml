test:
  name: "RWT-S01: navigate and assert page title element"
  tags: [rwt, smoke, navigation]
  steps:
    - navigate: "https://www.saucedemo.com"
    - assert_element_visible: "#user-name"
    - assert_element_visible: "#password"
    - assert_element_visible: "#login-button"
    - assert_url_contains: "saucedemo"
