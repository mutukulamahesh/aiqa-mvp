# RWT Cycle 4 — Performance
# Validates timing behavior, multi-step throughput, and db query performance
# under realistic load conditions (sequential, single worker).

tests:
  - test:
      name: "RWT-P01: sequential API calls — latency within bounds"
      tags: [rwt, performance, api]
      steps:
        - api:
            method:        GET
            url:           "https://jsonplaceholder.typicode.com/posts/1"
            assert_status: 200
        - api:
            method:        GET
            url:           "https://jsonplaceholder.typicode.com/posts/2"
            assert_status: 200
        - api:
            method:        GET
            url:           "https://jsonplaceholder.typicode.com/posts/3"
            assert_status: 200
        - api:
            method:        GET
            url:           "https://jsonplaceholder.typicode.com/posts/4"
            assert_status: 200
        - api:
            method:        GET
            url:           "https://jsonplaceholder.typicode.com/posts/5"
            assert_status: 200

  - test:
      name: "RWT-P02: db query throughput — multiple queries in sequence"
      tags: [rwt, performance, db]
      steps:
        - db:
            query:       "SELECT * FROM products"
            assert_rows: 10
        - db:
            query:       "SELECT * FROM customers"
            assert_rows: 5
        - db:
            query:       "SELECT * FROM orders"
            assert_rows: 5
        - db:
            query:       "SELECT * FROM order_details"
            assert_rows: 10
        - db:
            query:       "SELECT * FROM categories"
            assert_rows: 5

  - test:
      name: "RWT-P03: wait_ms precision — cumulative delay within tolerance"
      tags: [rwt, performance, timing]
      steps:
        - wait_ms: 100
        - wait_ms: 100
        - wait_ms: 100

  - test:
      name: "RWT-P04: full login flow timing — page navigation round-trip"
      tags: [rwt, performance, navigation]
      steps:
        - navigate: "https://www.saucedemo.com"
        - fill:
            target: "#user-name"
            value:  "standard_user"
        - fill:
            target: "#password"
            value:  "secret_sauce"
        - click: "#login-button"
        - assert_url_contains: "/inventory"
        - assert_element_visible: ".inventory_list"
