# RWT Cycle 5 — Security
# Validates SSRF protection, db read-only enforcement, and parameterized query safety.
# These tests verify the platform's security controls fire correctly.

tests:
  - test:
      name: "RWT-SEC01: SSRF guard — allowed URL succeeds"
      tags: [rwt, security, ssrf]
      steps:
        - api:
            method:        GET
            url:           "https://jsonplaceholder.typicode.com/todos/1"
            assert_status: 200

  - test:
      name: "RWT-SEC02: db read-only — SELECT succeeds under readOnly: true"
      tags: [rwt, security, db, readonly]
      steps:
        - db:
            query:       "SELECT product_name, unit_price FROM products WHERE unit_price > 20"
            assert_rows: 3

  - test:
      name: "RWT-SEC03: parameterized query — special characters in param are safe"
      tags: [rwt, security, db, injection]
      steps:
        - db:
            query:       "SELECT company_name FROM customers WHERE customer_id = ?"
            params:      ["ALFKI'; DROP TABLE customers; --"]
            assert_rows: 0

  - test:
      name: "RWT-SEC04: API allowlist — second allowed domain works"
      tags: [rwt, security, ssrf, allowlist]
      steps:
        - navigate: "https://www.saucedemo.com"
        - assert_element_visible: "#login-button"

  - test:
      name: "RWT-SEC05: db parameterized — numeric param prevents type confusion"
      tags: [rwt, security, db]
      steps:
        - db:
            query:       "SELECT product_name FROM products WHERE product_id = ?"
            params:      [1]
            assert_rows: 1
            assert_field:
              product_name: "Chai"
