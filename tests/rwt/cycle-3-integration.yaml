# RWT Cycle 3 — Integration
# Validates db: steps against real SQLite Northwind data.
# Pre-requisite: run `npx ts-node scripts/setup-rwt-db.ts` once before this cycle.
# DB_URL must be set to sqlite://./rwt-data/northwind.db (see .env).

tests:
  - test:
      name: "RWT-I01: db select — count all products"
      tags: [rwt, integration, db]
      steps:
        - db:
            query:       "SELECT COUNT(*) AS total FROM products WHERE discontinued = 0"
            assert_rows: 1

  - test:
      name: "RWT-I02: db assert_field — verify category name"
      tags: [rwt, integration, db]
      steps:
        - db:
            query:        "SELECT category_name FROM categories WHERE category_id = 1"
            assert_rows:  1
            assert_field:
              category_name: "Beverages"

  - test:
      name: "RWT-I03: db store_as — use row value in subsequent step"
      tags: [rwt, integration, db, variables]
      steps:
        - db:
            query:    "SELECT company_name FROM customers WHERE customer_id = 'ALFKI'"
            store_as: customer
        - assert_text_visible: "Alfreds"
          # Note: assert_text_visible checks page DOM — for pure variable assertion
          # use judge: which can evaluate the stored value.
        - judge:
            prompt:  "Does the company name '${customer.company_name}' sound like a German company?"
            value:   "${customer.company_name}"
            pass_if: ">= 0.5"

  - test:
      name: "RWT-I04: db parameterized query — products by category"
      tags: [rwt, integration, db]
      steps:
        - db:
            query:       "SELECT product_name FROM products WHERE category_id = ? ORDER BY product_id"
            params:      [1]
            assert_rows: 2

  - test:
      name: "RWT-I05: API + db cross-validation"
      tags: [rwt, integration, api, db]
      steps:
        - api:
            method:        GET
            url:           "https://jsonplaceholder.typicode.com/users/1"
            assert_status: 200
            store_as:      apiUser
        - db:
            query:        "SELECT COUNT(*) AS cnt FROM customers"
            assert_rows:  1
            assert_field:
              cnt: "5"

  - test:
      name: "RWT-I06: db join — order details with product names"
      tags: [rwt, integration, db]
      steps:
        - db:
            query: >
              SELECT o.order_id, p.product_name, od.quantity
              FROM orders o
              JOIN order_details od ON od.order_id = o.order_id
              JOIN products p ON p.product_id = od.product_id
              WHERE o.order_id = 10248
            assert_rows: 2
