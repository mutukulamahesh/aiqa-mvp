test:
  name: "RWT-R01: smoke regression — login and inventory page"
  tags: [rwt, regression, smoke]
  steps:
    - navigate: "https://www.saucedemo.com"
    - fill:
        target: "#user-name"
        value:  "standard_user"
    - fill:
        target: "#password"
        value:  "secret_sauce"
    - click: "#login-button"
    - assert:
        url: "/inventory"
    - assert:
        visible: ".inventory_list"
