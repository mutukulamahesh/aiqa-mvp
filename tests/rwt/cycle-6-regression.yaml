# RWT Cycle 6 — Regression
# Golden-path regression sweep: one representative test from each cycle.
# Run after any platform change to verify no regressions across all feature areas.

tests:
  - test:
      name: "RWT-R01: smoke regression — login and inventory page"
      tags: [rwt, regression, smoke]
      steps:
        - navigate: "https://www.saucedemo.com"
        - fill:
            target: "#user-name"
            value:  "standard_user"
        - fill:
            target: "#password"
            value:  "secret_sauce"
        - click: "#login-button"
        - assert_url_contains: "/inventory"
        - assert_element_visible: ".inventory_list"

  - test:
      name: "RWT-R02: functional regression — llm_eval quality check"
      tags: [rwt, regression, llm_eval]
      retries: 1
      steps:
        - llm_eval:
            target: fast
            prompt: "What is the capital of Japan? One word."
            assert_quality:
              criteria: "The response is Tokyo"
              pass_if:  "score >= 0.7"

  - test:
      name: "RWT-R03: integration regression — db select with assertion"
      tags: [rwt, regression, db]
      steps:
        - db:
            query:        "SELECT category_name FROM categories WHERE category_id = 1"
            assert_rows:  1
            assert_field:
              category_name: "Beverages"

  - test:
      name: "RWT-R04: integration regression — API call returns 200"
      tags: [rwt, regression, api]
      steps:
        - api:
            method:        GET
            url:           "https://jsonplaceholder.typicode.com/posts/1"
            assert_status: 200

  - test:
      name: "RWT-R05: consistency regression — low variance on stable fact"
      tags: [rwt, regression, llm_consistency]
      retries: 1
      steps:
        - llm_consistency:
            target: fast
            prompt: "What is the capital of France? One word."
            runs:   3
            assert_variance:
              max:    0.2
              metric: max

  - test:
      name: "RWT-R06: security regression — parameterized db query is safe"
      tags: [rwt, regression, security, db]
      steps:
        - db:
            query:       "SELECT product_name FROM products WHERE product_id = ?"
            params:      [1]
            assert_rows: 1
            assert_field:
              product_name: "Chai"
