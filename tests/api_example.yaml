test:
  name: "JSONPlaceholder — API fetch and assert"
  steps:
    # Fetch a single user and store the response
    - api:
        method: GET
        url: "https://jsonplaceholder.typicode.com/users/1"
        assert_status: 200
        store_as: user

    # Assert a top-level field
    - assert:
        value: "{{ user.name }}"
        equals: "Leanne Graham"

    # Assert a nested field
    - assert:
        value: "{{ user.address.city }}"
        equals: "Gwenborough"

    # POST a new resource and check the created ID
    - api:
        method: POST
        url: "https://jsonplaceholder.typicode.com/posts"
        body:
          title: "AIQA test post"
          body: "automated"
          userId: 1
        assert_status: 201
        store_as: created_post

    - assert:
        value: "{{ created_post.title }}"
        equals: "AIQA test post"
