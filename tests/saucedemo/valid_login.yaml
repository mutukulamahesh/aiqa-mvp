test:
  name: "Valid Login"
  tags: [imported]
  steps:
    - navigate: "https://www.saucedemo.com/"
    - fill:
        target: "username"
        value: "standard_user"
    - fill:
        target: "password"
        value: "secret_sauce"
    - click: "login_button"
    - assert:
        url: "inventory"
  # Expected: User logged in successfully
