test:
  name: "Logout"
  tags: [saucedemo]
  steps:
    - navigate: "https://www.saucedemo.com/"
    - fill:
        target: "username"
        value: "standard_user"
    - fill:
        target: "password"
        value: "secret_sauce"
    - click: '[data-test="login-button"]'
    - click: "#react-burger-menu-btn"
    - click: "#logout_sidebar_link"
    - assert:
        visible: '[data-test="login-button"]'
