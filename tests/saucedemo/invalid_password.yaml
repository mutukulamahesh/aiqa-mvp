test:
  name: "Invalid Password"
  tags: [saucedemo]
  steps:
    - navigate: "https://www.saucedemo.com/"
    - fill:
        target: "username"
        value: "standard_user"
    - fill:
        target: "password"
        value: "wrong_password"
    - click: '[data-test="login-button"]'
    - assert:
        text: "Epic sadface"
