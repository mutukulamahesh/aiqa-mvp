test:
  name: "Invalid Password"
  tags: [imported]
  steps:
    - navigate: "https://www.saucedemo.com/"
    - fill:
        target: "username"
        value: "standard_user"
    - fill:
        target: "password"
        value: "wrong_password"
    - click: "login_button"
    - assert:
        text: "error message"
  # Expected: Error displayed
