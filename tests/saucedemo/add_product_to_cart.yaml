test:
  name: "Add Product to Cart"
  tags: [saucedemo]
  steps:
    - navigate: "https://www.saucedemo.com/"
    - fill:
        target: "username"
        value: "standard_user"
    - fill:
        target: "password"
        value: "secret_sauce"
    - click: '[data-test="login-button"]'
    - click: '[data-test="add-to-cart-sauce-labs-backpack"]'
    - assert:
        visible: ".shopping_cart_badge"
